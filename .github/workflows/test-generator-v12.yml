name: Test Dense Generator v12

on:
  push:
    paths:
      - "generator-v12.js"
      - "tools/test_generator_v12.mjs"
      - "words-easy.json"
      - "words-medium.json"
      - "words-hard.json"
      - ".github/workflows/test-generator-v12.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wordscribble-generator-v12-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check generator-v12.js
          node --check play-v12.js
          node --check tools/test_generator_v12.mjs

      - name: Generate and validate every grid size
        id: generator_test
        run: |
          set +e
          node tools/test_generator_v12.mjs > generator-test-output.txt 2>&1
          code=$?
          cat generator-test-output.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit test report or diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator-test-output.txt
          if [ -f generator-test-results.json ]; then
            git add generator-test-results.json
          fi
          if git diff --cached --quiet; then
            echo "Generator report unchanged."
          else
            git commit -m "Validate dense generator with quality-filtered bank"
            git push
          fi

      - name: Fail workflow after preserving diagnostics
        if: steps.generator_test.outputs.exit_code != '0'
        run: exit 1
