name: Test Dense Generator v12

on:
  push:
    paths:
      - "generator-v12.js"
      - "play-v12.js"
      - "tools/test_generator_v12.mjs"
      - "words-easy.json"
      - "words-medium.json"
      - "words-hard.json"
      - ".github/workflows/test-generator-v12.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordscribble-generator-v12-tests
  cancel-in-progress: true

jobs:
  test:
    name: Validate all grid sizes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check generator-v12.js
          node --check play-v12.js
          node --check tools/test_generator_v12.mjs

      - name: Generate and validate every grid size
        run: node tools/test_generator_v12.mjs

      - name: Show density report
        if: always()
        run: |
          if [ -f generator-test-results.json ]; then
            cat generator-test-results.json
          else
            echo "No density report was created because the generator test stopped early."
          fi
