<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>WordScribble</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f4f6fb;font-family:system-ui,-apple-system,sans-serif}
#status{position:fixed;inset:0;display:grid;place-items:center;color:#182033;font-weight:700;text-align:center;padding:20px}
iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="status">✎ WordScribble wird vorbereitet …</div>
<script>
(async()=>{
 const q=new URLSearchParams(location.search);
 const difficulty=['easy','medium','hard'].includes(q.get('difficulty'))?q.get('difficulty'):'medium';
 const size=[9,11,13,15].includes(Number(q.get('size')))?Number(q.get('size')):11;
 const forceNew=q.get('new')==='1';
 const names={easy:'Leicht',medium:'Mittel',hard:'Anspruchsvoll'};
 const base='https://cdn.jsdelivr.net/gh/Christian1Binder/wordscribble@774488ef057828c293f9b9c94cdebf7b1d909634/index.html';
 const r=await fetch(base,{cache:'no-store'});
 if(!r.ok)throw new Error('Basisdatei nicht erreichbar: '+r.status);
 let h=await r.text();

 const source=h.match(/const WORDS=(\[[\s\S]*?\]);\s*const N=13/);
 if(!source)throw new Error('Wortliste konnte nicht gelesen werden.');
 const all=(new Function('return '+source[1]))();
 const max=Math.max(4,size-1);
 let pool=all.filter(([word])=>{
   const n=word.length;
   if(n>max)return false;
   if(difficulty==='easy')return n<=5;
   if(difficulty==='hard')return n>=6;
   return n>=4&&n<=7;
 });
 if(pool.length<12)pool=all.filter(([word])=>word.length<=max);
 h=h.replace(source[0],'const WORDS='+JSON.stringify(pool)+'; const N='+size);

 const stateKey='wordscribble-state-v1-'+difficulty+'-'+size;
 if(forceNew)localStorage.removeItem(stateKey);
 h=h.replace("const stateKey='wordscribble-state-v1'","const stateKey='"+stateKey+"'");
 h=h.replace('<strong id="puzzleTitle">Testrätsel</strong>','<strong id="puzzleTitle">'+names[difficulty]+' · '+size+' × '+size+'</strong>');
 h=h.replace('<div class="toolbar"><button class="btn" id="newBtn">','<div class="toolbar"><button class="btn" id="homeBtn">Startseite</button><button class="btn" id="newBtn">');
 h=h.replace('<h1>WordScribble</h1>','<h1>WordScribble <small style="font-size:.45em;color:#3157d5">v0.7</small></h1>');

 const css=`<style>
 @media(max-width:650px){.toolbar{grid-template-columns:repeat(4,1fr)!important}}
 .ws-switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:#eef1f7;border-radius:13px;margin-bottom:12px}
 .ws-mode{border:0;border-radius:9px;min-height:42px;background:transparent;color:#677089;font:750 16px system-ui}
 .ws-mode.active{background:#fff;color:#3157d5;box-shadow:0 2px 9px rgba(28,39,70,.1)}
 .ws-scribble[hidden],.ws-old[hidden]{display:none!important}
 .ws-box{border:2px solid #3157d5;border-radius:16px;background:#fff;min-height:220px;display:grid;place-items:center;padding:16px;position:relative}
 .ws-box:focus-within{box-shadow:0 0 0 4px rgba(49,87,213,.14)}
 #wsInput{width:100%;height:170px;border:0;outline:0;background:transparent;text-align:center;text-transform:uppercase;font-size:clamp(48px,9vw,82px);font-weight:760;letter-spacing:.05em;color:#182033;padding:10px;resize:none;font-family:system-ui,-apple-system,sans-serif}
 #wsInput::placeholder{font-size:18px;font-weight:600;letter-spacing:0;text-transform:none;color:#a0a7b5}
 .ws-help{margin:10px 2px 0;color:#677089;font-size:14px;line-height:1.45}
 .ws-help strong{color:#3157d5}.ws-state{position:absolute;right:10px;top:9px;border-radius:999px;background:#e9eeff;color:#3157d5;padding:4px 8px;font-size:12px;font-weight:800}
 </style>`;

 const js=`<script>(()=>{
 const card=document.querySelector('.write-card'),target=document.getElementById('currentClue'),canvas=document.getElementById('canvasWrap'),actions=document.querySelector('.write-actions'),recognition=document.querySelector('.recognition');
 if(!card||!target||!canvas||!actions||!recognition)return;
 const sw=document.createElement('div');sw.className='ws-switch';sw.innerHTML='<button class="ws-mode active" id="wsS" type="button">Wort schreiben</button><button class="ws-mode" id="wsD" type="button">Zeichnen (alt)</button>';
 const sp=document.createElement('div');sp.className='ws-scribble';sp.innerHTML='<div class="ws-box"><span class="ws-state" id="wsState">Apple Kritzeln</span><textarea id="wsInput" rows="1" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="Ganzes Lösungswort schreiben"></textarea></div><p class="ws-help"><strong>Deutlich zuverlässiger:</strong> Schreibe möglichst das ganze Lösungswort statt einzelner Buchstaben. Apple erkennt zusammenhängende Wörter besser; WordScribble trägt anschließend alle erkannten Buchstaben nacheinander ein. Ein einzelner Buchstabe funktioniert weiterhin.</p>';
 const old=document.createElement('div');old.className='ws-old';old.hidden=true;target.after(sw,sp,old);old.append(canvas,actions,recognition);
 const input=document.getElementById('wsInput'),state=document.getElementById('wsState'),sb=document.getElementById('wsS'),db=document.getElementById('wsD');
 function mode(s){sp.hidden=!s;old.hidden=s;sb.classList.toggle('active',s);db.classList.toggle('active',!s);if(s)setTimeout(()=>input.focus({preventScroll:true}),60)}
 sb.onclick=()=>mode(true);db.onclick=()=>mode(false);
 function clean(v){return (v||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase().replace(/Ä/g,'A').replace(/Ö/g,'O').replace(/Ü/g,'U').replace(/ß/g,'SS').replace(/[^A-Z]/g,'')}
 let t,composing=false;
 function commit(){clearTimeout(t);if(composing)return;const letters=clean(input.value);if(!letters)return;input.value='';state.textContent=letters+' übernommen';for(const l of letters)window.dispatchEvent(new KeyboardEvent('keydown',{key:l,code:'Key'+l,bubbles:true,cancelable:true}));setTimeout(()=>{state.textContent='Apple Kritzeln';input.focus({preventScroll:true})},900)}
 function schedule(){clearTimeout(t);const letters=clean(input.value);state.textContent=letters?'Erkannt: '+letters:'Apple Kritzeln';if(letters)t=setTimeout(commit,850)}
 input.addEventListener('compositionstart',()=>{composing=true;clearTimeout(t);state.textContent='Schrift wird erkannt …'});
 input.addEventListener('compositionend',()=>{composing=false;schedule()});
 input.addEventListener('input',()=>{if(!composing)schedule()});
 input.addEventListener('change',commit);
 input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit()}});
 document.getElementById('homeBtn')?.addEventListener('click',()=>parent.location.href='./index.html');
 mode(true);
 })();<\/script>`;

 h=h.replace('</head>',css+'</head>');
 h=h.replace('</body>',js+'</body>');
 const f=document.createElement('iframe');f.title='WordScribble';f.srcdoc=h;
 document.getElementById('status').remove();document.body.appendChild(f);
})().catch(e=>{document.getElementById('status').innerHTML='Fehler beim Laden:<br><small>'+String(e.message||e)+'</small>'});
</script>
</body>
</html>
