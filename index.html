<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3157d5"><title>WordScribble wird geladen …</title><style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#f4f6fb;color:#182033;font:600 17px system-ui,-apple-system,sans-serif}.box{text-align:center;padding:28px}.dot{font-size:40px;color:#3157d5}</style></head>
<body><div class="box"><div class="dot">✎</div>WordScribble wird geladen …</div>
<script>
(async()=>{
 const sources=[
  'https://cdn.jsdelivr.net/gh/Christian1Binder/wordscribble@774488ef057828c293f9b9c94cdebf7b1d909634/index.html',
  'https://raw.githubusercontent.com/Christian1Binder/wordscribble/774488ef057828c293f9b9c94cdebf7b1d909634/index.html'
 ];
 let html='',lastError;
 for(const url of sources){try{const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw new Error('HTTP '+r.status);html=await r.text();if(html.includes('WordScribble'))break}catch(e){lastError=e}}
 if(!html)throw lastError||new Error('Basisdatei nicht erreichbar');
 html=html.replace('</body>','<script src="./scribble-patch.js?v=20260730"><\\/script></body>');
 document.open();document.write(html);document.close();
})().catch(e=>{document.body.innerHTML='<div class="box"><div class="dot">!</div>WordScribble konnte nicht geladen werden.<br><small>'+String(e.message||e)+'</small></div>'});
</script></body></html>
