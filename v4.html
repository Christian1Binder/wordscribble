<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>WordScribble v0.4</title>
<style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#f4f6fb;color:#182033;font:600 17px system-ui,-apple-system,sans-serif}.load{text-align:center;padding:28px}.mark{font-size:42px;color:#3157d5}</style>
</head>
<body><div class="load"><div class="mark">✎</div>WordScribble v0.4 wird geladen …</div>
<script>
(async()=>{
  const base='https://cdn.jsdelivr.net/gh/Christian1Binder/wordscribble@774488ef057828c293f9b9c94cdebf7b1d909634/index.html';
  const response=await fetch(base,{cache:'no-store'});
  if(!response.ok) throw new Error('Basis-App nicht erreichbar: '+response.status);
  let html=await response.text();
  const patch=String.raw`
<script>
(()=>{
  'use strict';
  const start=()=>{
    const panel=document.querySelector('.entry-panel');
    const target=document.querySelector('#entryTarget');
    const canvas=document.querySelector('#canvasWrap');
    const actions=document.querySelector('.canvas-actions');
    const recognition=document.querySelector('#recognitionBox');
    const note=document.querySelector('.learn-note');
    if(!panel||!target||!canvas||!actions||!recognition){setTimeout(start,100);return;}
    if(document.querySelector('#wsScribbleInput'))return;

    const style=document.createElement('style');
    style.textContent=`
      .ws-version{font-size:.45em;color:#3157d5;margin-left:6px;vertical-align:middle}
      .ws-switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:#eef1f7;border-radius:13px;margin:12px 0 10px}
      .ws-switch button{border:0;border-radius:9px;min-height:42px;background:transparent;color:#677089;font-weight:750}
      .ws-switch button.active{background:#fff;color:#3157d5;box-shadow:0 2px 9px rgba(28,39,70,.1)}
      .ws-scribble{border:2px solid #3157d5;border-radius:16px;background:#fff;min-height:220px;padding:16px;display:grid;place-items:center;overflow:hidden}
      .ws-scribble:focus-within{box-shadow:0 0 0 4px rgba(49,87,213,.14)}
      #wsScribbleInput{width:100%;height:175px;border:0;outline:0;background:transparent;text-align:center;text-transform:uppercase;font-size:clamp(64px,13vw,104px);font-weight:760;letter-spacing:.08em;color:#182033;caret-color:#3157d5;padding:8px}
      #wsScribbleInput::placeholder{font-size:clamp(17px,3vw,23px);font-weight:600;letter-spacing:0;text-transform:none;color:#a0a7b5}
      .ws-help{margin:9px 2px 4px;color:#677089;font-size:.84rem;line-height:1.4}
      .ws-help strong{color:#182033}
      .ws-hidden{display:none!important}
      .ws-status{margin-top:10px;padding:10px 12px;border-radius:11px;background:#e8edff;color:#3157d5;font-weight:700;font-size:.86rem}
    `;
    document.head.appendChild(style);

    const h1=document.querySelector('h1');
    if(h1&&!h1.querySelector('.ws-version'))h1.insertAdjacentHTML('beforeend','<span class="ws-version">v0.4</span>');

    const switcher=document.createElement('div');
    switcher.className='ws-switch';
    switcher.innerHTML='<button id="wsScribbleMode" class="active" type="button">Apple Kritzeln</button><button id="wsDrawMode" type="button">Zeichnen (alt)</button>';

    const scribble=document.createElement('div');
    scribble.id='wsScribblePanel';
    scribble.innerHTML='<div class="ws-scribble"><input id="wsScribbleInput" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" maxlength="4" placeholder="Hier mit dem Apple Pencil schreiben" aria-label="Buchstabe mit Apple Pencil schreiben"></div><div class="ws-help"><strong>Apple Kritzeln:</strong> Schreibe einen einzelnen Buchstaben direkt in das große Textfeld. iPadOS wandelt ihn in Text um; WordScribble trägt ihn anschließend in das aktive Kästchen ein.</div><div class="ws-status" id="wsStatus">Kritzeln-Eingabe bereit</div>';

    target.parentElement.insertAdjacentElement('afterend',switcher);
    switcher.insertAdjacentElement('afterend',scribble);

    const oldParts=[canvas,actions,recognition,note].filter(Boolean);
    oldParts.forEach(el=>el.classList.add('ws-hidden'));

    const input=document.querySelector('#wsScribbleInput');
    const status=document.querySelector('#wsStatus');
    const scribbleBtn=document.querySelector('#wsScribbleMode');
    const drawBtn=document.querySelector('#wsDrawMode');
    let timer;

    function setMode(mode){
      const useScribble=mode==='scribble';
      scribble.classList.toggle('ws-hidden',!useScribble);
      oldParts.forEach(el=>el.classList.toggle('ws-hidden',useScribble));
      scribbleBtn.classList.toggle('active',useScribble);
      drawBtn.classList.toggle('active',!useScribble);
      localStorage.setItem('wordscribble-mode-v4',useScribble?'scribble':'draw');
      if(useScribble)setTimeout(()=>input.focus({preventScroll:true}),70);
    }

    function submit(){
      const letters=input.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().match(/[A-Z]/g);
      if(!letters?.length)return;
      clearTimeout(timer);
      timer=setTimeout(()=>{
        const letter=letters[letters.length-1];
        input.value='';
        status.textContent='Erkannt: '+letter;
        window.dispatchEvent(new KeyboardEvent('keydown',{key:letter,bubbles:true,cancelable:true}));
        document.dispatchEvent(new KeyboardEvent('keydown',{key:letter,bubbles:true,cancelable:true}));
        setTimeout(()=>{status.textContent='Kritzeln-Eingabe bereit';input.focus({preventScroll:true});},350);
      },100);
    }

    input.addEventListener('input',submit);
    input.addEventListener('compositionend',submit);
    input.addEventListener('pointerdown',e=>{status.textContent=e.pointerType==='pen'?'Apple Pencil erkannt – jetzt schreiben':'Texteingabe aktiv';});
    scribbleBtn.onclick=()=>setMode('scribble');
    drawBtn.onclick=()=>setMode('draw');
    setMode(localStorage.getItem('wordscribble-mode-v4')||'scribble');
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
<\/script>`;
  html=html.replace('</body>',patch+'</body>');
  document.open();document.write(html);document.close();
})().catch(error=>{document.body.innerHTML='<div class="load"><div class="mark">!</div>WordScribble konnte nicht geladen werden.<br><small>'+String(error.message||error)+'</small></div>';});
</script>
</body>
</html>
